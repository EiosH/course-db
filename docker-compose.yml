version: '3.5'

services:
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/qdrant:/qdrant/storage

  tei:
    container_name: text-embeddings-inference
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    ports:
      - "8080:80"
    command: --model-id BAAI/bge-m3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
