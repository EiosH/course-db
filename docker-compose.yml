services:
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/qdrant:/qdrant/storage

  mysql:
    container_name: mysql
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-course_db}
      MYSQL_USER: ${MYSQL_USER:-course}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-course}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/mysql:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingest:
    container_name: ingest
    build: ./ingest
    depends_on:
      - qdrant
    env_file:
      - .env
    extra_hosts:
      # Linux: reach host vLLM / Ollama from inside the container
      - "host.docker.internal:host-gateway"
    environment:
      QDRANT_URL: http://qdrant:6333
      LECTURES_DIR: /data/lectures
      EMBED_DEVICE: ${EMBED_DEVICE:-cpu}
      # Override .env 127.0.0.1 — that only works when Python runs on the host
      VLLM_BASE_URL: http://host.docker.internal:8000/v1
      OLLAMA_URL: http://host.docker.internal:11434
    volumes:
      - ./data/lectures:/data/lectures

  llm:
    container_name: llm
    build: ./llm
    depends_on:
      qdrant:
        condition: service_started
      mysql:
        condition: service_healthy
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      QDRANT_URL: http://qdrant:6333
      LECTURES_DIR: /data/lectures
      EMBED_DEVICE: ${EMBED_DEVICE:-cpu}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-course_db}
      MYSQL_USER: ${MYSQL_USER:-course}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-course}
      VLLM_BASE_URL: http://host.docker.internal:8000/v1
      OLLAMA_URL: http://host.docker.internal:11434
    volumes:
      - ./data/lectures:/data/lectures
      - ./llm/app/data:/app/data
