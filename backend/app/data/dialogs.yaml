  - id: quiz-list-length
    timestamp: "00:19:12"
    current_quarter: 2026-Spring
    current_course: CSC477
    current_lecture: lec05
    turns:
      - "Consider the following Scala function: def f [X] (xs:List[X]) : List[X] =   xs match     case Nil => Nil     case y::ys => y::(y::(f (ys)))   end match end f. If this function is executed on a list of length N, what is the length of the resulting list? Options: N, 2N, N-1, 2N-1, 2(N-1)"
      - "I picked 2N-1. Why is that wrong?"
      - "What if the second case were y::f(ys) instead?"
      - "And what would the original version return for List(1,2,3)?"
      - "Did the instructor go over this question in class?"
      - "Is this function tail recursive?"
      - "How would I rewrite it to be tail recursive?"
      - "Is recursion actually used in industry, or is it just academic?"
      - "Go back to the first question and explain it like I'm a beginner."
      - "ok got it"

  - id: quiz-option-adt
    timestamp: "00:09:57"
    current_quarter: 2026-Spring
    current_course: CSC477
    current_lecture: lec03
    turns:
      - "Consider the following algebraic data type: enum Option[+T]:   case None   case Some(value: T) end Option. What type (if any) does this expression have? import Option.* List (None, Some (List (Some (1), None, Some (2)))) Options: Option[List[Option[List[Int]]]], List[Option[List[Option[Int]]]], List[Option[Option[List[Int]]]], List[List[Option[Option[Int]]]], This expression fails static type checking, so is rejected by the compiler"
      - "Why doesn't it fail type checking? None and Some look like different types."
      - "What does the + in Option[+T] mean?"
      - "Which lecture explained that plus sign in the most detail?"
      - "How is this different from using null in Java?"
      - "Why did Java have null in the first place then?"
      - "Is Kotlin better than Scala for this?"
      - "Wait, which option was correct again? Just give me the number."
      - "这个和 Rust 的 Option 是一回事吗？"

  - id: quiz-static-dynamic-types
    timestamp: "00:15:14"
    current_quarter: 2026-Spring
    current_course: CSC477
    current_lecture: lec09
    turns:
      - "Consider this Scala code: class Animal; class Bird extends Animal; val a: Animal = new Animal(); val b: Bird = new Bird(); val c: Animal = new Bird(); val d: Animal = b; val e = c; val f = b. What are the static and dynamic types of a, b, c, d, e, and f?"
      - "Why is the static type of e Animal and not Bird?"
      - "So if both classes override toString, which one runs for e.toString()?"
      - "True or False: given val a: A = new B() and val b: B = new B() where B overrides f, the values returned by a.f and b.f are the same regardless of how f is implemented. Explain."
      - "What would change in C++ if f were not virtual?"
      - "Is that why the instructor said C++ is dangerous?"
      - "Which is faster, static or dynamic dispatch?"
      - "Should I just avoid inheritance then?"
      - "Summarize everything we discussed in 3 bullet points."

