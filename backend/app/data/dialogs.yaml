# 批量评估输入（python main.py 默认读取本文件）
#
# user_courses：选课清单，所有对话共用。
#   材料目录: data/lectures/<course_id>/<lecture_id>/{doc.txt, transcript.vtt, meta.json}
#
# dialogs：每一项是一段对话，按顺序执行；同一段对话里的各轮共享上下文。
#   每段对话必须写明会话信息（学生此刻在看哪门课、哪一讲、播放到哪）：
#   - id: call-by-name           # 多轮必须有 id，结果里序号列显示为 id#轮次
#     timestamp: "01:22:09"      # 当前播放进度，必须加引号
#     current_quarter: 2026-Spring
#     current_course: CSC477     # 必须在 user_courses 里
#     current_lecture: lec08     # 必须在该课程的 lecture_id 里
#     turns:
#       - "What did the instructor say about call by name?"
#       - "Give me an example of it."
#
# 问题里有 ": "（冒号加空格）时必须加引号，建议统一加双引号。

user_courses:
  - course_id: CSC477
    quarter: 2026-Spring
    lecturer: Eric J. Fredericks
